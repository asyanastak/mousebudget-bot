<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бюджет — Web App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #111;
      padding-bottom: 80px;
    }
    .container { max-width: 420px; margin: 0 auto; padding: 16px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      font-size: 18px;
      font-weight: 600;
    }
    .period-select {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .money-big {
      font-size: 32px;
      font-weight: 700;
      margin: 8px 0;
    }
    .money-big.income { color: #1a9a4a; }
    .money-big.expense { color: #d93025; }
    .money-big.debt { color: #f4b400; }
    .money-big.balance { color: #1a73e8; }
    .label-small { font-size: 13px; color: #666; margin-bottom: 4px; }
    .cat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .cat-row:last-child { border-bottom: none; }
    .cat-name { font-size: 15px; }
    .cat-amount { font-weight: 600; }
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .input-group input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }
    .input-group select {
      width: 150px;
      padding: 10px 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }
    button.primary {
      width: 100%;
      padding: 12px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:active { background: #1557b0; }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .cat-btn {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }
    .cat-btn.active {
      border-color: #1a73e8;
      background: #e8f0fe;
    }
    .status { margin-top: 8px; font-size: 13px; color: #1a9a4a; min-height: 18px; }
    .status.error { color: #d93025; }
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: #666;
    }
    .empty-state span { font-size: 30px; display: block; margin-bottom: 8px; }
    .access-denied {
      text-align: center;
      padding: 60px 20px;
    }
    .access-denied span { font-size: 50px; display: block; margin-bottom: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container hidden" id="app">
    <header>
      <span>💰 Бюджет</span>
      <select class="period-select" id="periodSelect"></select>
    </header>

    <div class="card">
      <div class="card-title">Итог за период</div>
      <div class="money-big income" id="incAmount">0 ₽</div>
      <div class="label-small">Доходы</div>
      <div class="money-big expense" id="expAmount">0 ₽</div>
      <div class="label-small">Расходы</div>
      <div class="money-big debt" id="debtAmount">0 ₽</div>
      <div class="label-small">Рассрочка</div>
      <div class="money-big balance" id="balAmount">0 ₽</div>
      <div class="label-small">Остаток</div>
    </div>

    <div class="card">
      <div class="card-title">По категориям</div>
      <div id="catList">Загрузка...</div>
    </div>

    <div class="card">
      <div class="card-title">Новая операция</div>
      <div class="input-group">
        <input type="number" id="inpAmount" placeholder="Сумма" step="0.01" min="0">
        <input type="text" id="inpComment" placeholder="Комментарий">
      </div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="status" id="status"></div>
      <button class="primary" id="btnAdd">Добавить</button>
    </div>
  </div>

  <div class="access-denied hidden" id="accessDenied">
    <span>🔒</span>
    <h2>Доступ запрещён</h2>
    <p>Это приложение доступно только владельцам бюджета.</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyk8wgAMhlfjfgUssyGHgzvFAQ_NPXNJQcQVbGsrhPYjWjqf40O-xCLv7IrOL-VEGQF/exec';

    // ВАШИ ID уже вставлены:
    const ALLOWED_IDS = [567232531, 1430603330];

    let currentCategory = null;
    let categories = {};
    let currentPeriod = '';

    const el = {
      app: document.getElementById('app'),
      accessDenied: document.getElementById('accessDenied'),
      periodSelect: document.getElementById('periodSelect'),
      incAmount: document.getElementById('incAmount'),
      expAmount: document.getElementById('expAmount'),
      debtAmount: document.getElementById('debtAmount'),
      balAmount: document.getElementById('balAmount'),
      catList: document.getElementById('catList'),
      inpAmount: document.getElementById('inpAmount'),
      inpComment: document.getElementById('inpComment'),
      catGrid: document.getElementById('catGrid'),
      status: document.getElementById('status'),
      btnAdd: document.getElementById('btnAdd')
    };

    // Проверка доступа — только ваши два ID
    const userId = tg.initDataUnsafe?.user?.id;
    if (!userId || !ALLOWED_IDS.includes(userId)) {
      el.app.classList.add('hidden');
      el.accessDenied.classList.remove('hidden');
      tg.showAlert('Доступ запрещён. Обратитесь к владельцу бюджета.');
      throw new Error('Access denied');
    }

    el.app.classList.remove('hidden');

    async function api(action, body = null) {
      const url = APPS_SCRIPT_URL + '?action=' + action;
      const opts = {
        method: body ? 'POST' : 'GET',
        headers: body ? { 'Content-Type': 'application/json' } : {},
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function loadData() {
      try {
        const [catsRes, summaryRes, periodsRes] = await Promise.all([
          api('getCategories'),
          api('getSummary', { period: currentPeriod }),
          api('getPeriods')
        ]);

        categories = catsRes.categories || {};
        renderCategoriesGrid(categories);
        renderPeriods(periodsRes);
        renderSummary(summaryRes);
        el.status.textContent = '';
      } catch (err) {
        el.status.textContent = 'Ошибка загрузки: ' + err.message;
        el.status.className = 'status error';
      }
    }

    function renderPeriods(data) {
      el.periodSelect.innerHTML = '';
      const optCur = document.createElement('option');
      optCur.value = data.current;
      optCur.textContent = data.current + ' (текущий)';
      el.periodSelect.appendChild(optCur);

      const optPrev = document.createElement('option');
      optPrev.value = data.previous;
      optPrev.textContent = data.previous;
      el.periodSelect.appendChild(optPrev);

      el.periodSelect.value = currentPeriod;
    }

    function renderSummary(data) {
      el.incAmount.textContent = formatMoney(data.income) + ' ₽';
      el.expAmount.textContent = formatMoney(data.expense) + ' ₽';
      el.debtAmount.textContent = formatMoney(data.debt) + ' ₽';
      el.balAmount.textContent = formatMoney(data.balance) + ' ₽';

      const byCat = data.byCat || {};
      let html = '';
      const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
      if (cats.length === 0) {
        html = '<div class="empty-state"><span>📭</span>Пока нет операций</div>';
      } else {
        html = cats.map(([cat, amt]) => {
          const type = categories[cat] ? categories[cat].type : 'expense';
          const color = type === 'income' ? '#1a9a4a' : (type === 'debt' ? '#f4b400' : '#d93025');
          return `
            <div class="cat-row">
              <span class="cat-name">${escapeHtml(cat)}</span>
              <span class="cat-amount" style="color:${color}">${formatMoney(amt)} ₽</span>
            </div>
          `;
        }).join('');
      }
      el.catList.innerHTML = html;
    }

    function renderCategoriesGrid(cats) {
      el.catGrid.innerHTML = '';
      Object.keys(cats).forEach(catName => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.textContent = catName;
        btn.onclick = () => {
          currentCategory = catName;
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        };
        el.catGrid.appendChild(btn);
      });
    }

    el.btnAdd.onclick = async () => {
      const amount = parseFloat(el.inpAmount.value);
      const comment = el.inpComment.value.trim();

      if (!amount || amount <= 0) {
        showStatus('Введите сумму', 'error');
        return;
      }
      if (!currentCategory) {
        showStatus('Выберите категорию', 'error');
        return;
      }

      el.btnAdd.disabled = true;
      el.btnAdd.textContent = 'Отправка...';

      try {
        await api('addOperation', {
          category: currentCategory,
          amount: amount,
          comment: comment,
          date: new Date().toISOString().split('T')[0]
        });
        el.inpAmount.value = '';
        el.inpComment.value = '';
        currentCategory = null;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        showStatus('✅ Добавлено!');
        loadData();
      } catch (err) {
        showStatus('Ошибка: ' + err.message, 'error');
      } finally {
        el.btnAdd.disabled = false;
        el.btnAdd.textContent = 'Добавить';
      }
    };

    el.periodSelect.onchange = () => {
      currentPeriod = el.periodSelect.value;
      loadData();
    };

    function showStatus(msg, type = '') {
      el.status.textContent = msg;
      el.status.className = 'status ' + type;
      if (type !== 'error') setTimeout(() => el.status.textContent = '', 2000);
    }

    function formatMoney(x) {
      return Math.round(x).toLocaleString('ru-RU');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    currentPeriod = new Date().toISOString().slice(0, 7);
    loadData();
  </script>
</body>
</html>
